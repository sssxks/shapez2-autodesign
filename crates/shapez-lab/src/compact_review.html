<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:dark;--foreground:#e4e8ee;--muted-foreground:#9aa8ba;--card:#18202a;--border:#364353;--primary:#8ab7ff;--radius:12px;--font-sans:system-ui,sans-serif;--chart-1:#70adff;--chart-2:#62d9ad;--chart-3:#ffbd69;--chart-4:#d498ed;--chart-5:#f18b8b;--chart-6:#ddd987}
body{margin:0;color:var(--foreground);font-family:var(--font-sans);font-size:14px}*{box-sizing:border-box}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}.box{background:var(--card);border-radius:var(--radius);padding:16px}.label{color:var(--muted-foreground);font-size:12px}.value{font-size:25px;font-weight:700;margin:4px 0 12px}.row{display:grid;grid-template-columns:28px 1fr 65px;align-items:center;gap:8px;margin-top:9px;font-size:12px}.bar{height:12px;background:var(--chart-1);border-radius:3px}.row.old .bar{background:var(--border)}.toolbar{display:flex;align-items:center;gap:8px;margin:20px 0 8px;flex-wrap:wrap}button{background:transparent;color:var(--muted-foreground);border:1px solid var(--border);border-radius:6px;padding:6px 12px;cursor:pointer}button.active{background:var(--primary);color:var(--card)}svg{width:100%;height:350px;display:block}.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted-foreground)}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px}p{color:var(--muted-foreground);font-size:12px;line-height:1.6;margin:9px 0 0}@media(max-width:440px){.stats{gap:8px}.box{padding:12px}.value{font-size:21px}.row{grid-template-columns:24px 1fr 52px;font-size:11px}svg{height:260px}}
</style>
<div class="stats" id="stats"></div><div class="toolbar"><strong>新布局</strong><button class="active" onclick="draw(0)">空间层 0</button><button onclick="draw(1)">空间层 1</button><button onclick="draw(2)">空间层 2</button><span class="label">圆圈为升降带，悬停查看线路</span></div><svg id="map" viewBox="-21 -8 32 17" aria-label="CMAM 三层空间运输布线"></svg><div class="legend" id="legend"></div><p>两组车站均按 P（销钉）→ C（圆）→ R（方）→ S（星）→ W（风车）→ 红 → 绿 → 蓝排列。灰色区域为生产主体；上方五个紫色平台为 RGB 转置器。空间层与平台内部的三层不同。</p>
<script>
const data=__DATA__,palette=['var(--chart-1)','var(--chart-2)','var(--chart-3)','var(--chart-4)','var(--chart-5)','#ec7777','#72cda4','#75a5f5'],names=['销钉','圆形','方形','星形','风车','红','绿','蓝'],mixed='var(--chart-4)',D=[[1,0],[0,1],[-1,0],[0,-1]];
const fmt=n=>n.toLocaleString('en-US'), old=data.previous;
function metric(title,a,b,suffix=''){return `<div class="box"><div class="label">${title}</div><div class="value">减少 ${((1-b/a)*100).toFixed(1)}%</div><div class="row old"><span>旧版</span><div class="bar"></div><span>${fmt(a)}${suffix}</span></div><div class="row"><span>新版</span><div class="bar" style="width:${b/a*100}%"></div><span>${fmt(b)}${suffix}</span></div></div>`}
document.getElementById('stats').innerHTML=old?metric('整张蓝图建筑数',old.summary.buildings,data.summary.buildings)+metric(`平面包围框 · ${old.bounds.width}×${old.bounds.height} → ${data.bounds.width}×${data.bounds.height}`,old.bounds.area,data.bounds.area,' 格'):'';
document.getElementById('legend').innerHTML=names.slice(0,5).map((n,i)=>`<span><i class="dot" style="background:${palette[i]}"></i>${n}</span>`).join('')+`<span><i class="dot" style="background:${mixed}"></i>RGB 管道</span>`;
function draw(layer){document.querySelectorAll('button').forEach((b,i)=>b.classList.toggle('active',i===layer));let s='';
for(let j=0;j<5;j++){s+=`<rect x="${-19+5*j}" y="2" width="5" height="3" rx=".15" fill="var(--border)" opacity="${layer===0?.65:.2}"/><text x="${-16.5+5*j}" y="3.7" text-anchor="middle" fill="var(--foreground)" font-size=".55">CMAM ${j+1}</text><rect x="${-17+5*j}" y="-2" width="3" height="1" rx=".08" fill="${mixed}" opacity="${layer===0?.5:.18}"/><text x="${-15.5+5*j}" y="-1.32" text-anchor="middle" fill="var(--foreground)" font-size=".45">RGB</text>`}
s+='<path d="M-20 -6.5H7" stroke="var(--border)" stroke-width=".2"/>';
for(const t of data.sources){let [x,y]=t.chunk;let i=data.sources.indexOf(t)%8;s+=`<rect x="${x+.06}" y="${y+.08}" width=".88" height="1.8" rx=".08" fill="${palette[i]}" opacity="${layer===0?.7:.2}"/><text x="${x+.5}" y="${y+.7}" text-anchor="middle" font-size=".43" fill="var(--foreground)">${['P','C','R','S','W','R','G','B'][i]}</text>`}
for(const n of data.routing){let[x,y,z]=n.p;if(layer<Math.min(z,n.out_z)||layer>Math.max(z,n.out_z))continue;const color=n.net>=16?mixed:palette[n.net%8];let paths=[];if(layer===z){const d=D[(n.input+2)%4];paths.push(`M${x+.5+d[0]*.5} ${y+.5+d[1]*.5}L${x+.5} ${y+.5}`)}if(layer===n.out_z)for(const o of n.outputs){const d=D[o];paths.push(`M${x+.5} ${y+.5}L${x+.5+d[0]*.5} ${y+.5+d[1]*.5}`)}s+=`<g><title>总线 ${n.net} · (${x},${y}) · ${z}→${n.out_z}</title><path d="${paths.join(' ')}" stroke="${color}" stroke-width=".13" fill="none" stroke-linecap="round"/>${z!==n.out_z?`<circle cx="${x+.5}" cy="${y+.5}" r=".22" fill="var(--card)" stroke="${color}" stroke-width=".1"/>`:''}</g>`}
document.getElementById('map').innerHTML=s;}
draw(0);
</script></html>
