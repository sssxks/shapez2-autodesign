[workspace]
members = ["crates/*", "tasks/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
varisat = "0.2.2"


shapez-model = { path = "crates/shapez-model" }
shapez-routing = { path = "crates/shapez-routing" }
shapez-blueprint = { path = "crates/shapez-blueprint" }
shapez-runtime = { path = "crates/shapez-runtime" }
shapez-viz = { path = "crates/shapez-viz" }
shapez-solver = { path = "crates/shapez-solver" }
